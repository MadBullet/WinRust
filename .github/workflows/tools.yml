name: tools

on:
  push:
    branches: [arena/1e8c9b58-winrust]
  workflow_dispatch:

jobs:
  vendor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: describe toolchain
        run: |
          rustc -V | Out-File -Append -Encoding utf8 diag.txt
          cargo -V | Out-File -Append -Encoding utf8 diag.txt
          Get-ChildItem . | Out-File -Append -Encoding utf8 diag.txt
      - name: fetch and vendor
        shell: bash
        run: |
          python tools/probe-crates.py > /tmp/vendor.log 2>&1
          cat /tmp/vendor.log >> diag.txt
          exit 0
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-src
          path: |
            /tmp/probe/vendor
            diag.txt
