name: tools

on:
  push:
    branches: [arena/1e8c9b58-winrust]
  workflow_dispatch:

jobs:
  api-dump:
    runs-on: ubuntu-latest
    steps:
      - name: fetch and dump API signatures
        run: |
          set -uxo pipefail
          mkdir -p /tmp/dump && cd /tmp/dump
          fetch() { curl -sSL "https://static.crates.io/crates/$1/$1-$2.crate" -o "$1.crate" && tar xzf "$1.crate"; }
          fetch windows-sys 0.59.0
          fetch eframe 0.29.1
          fetch egui 0.29.1
          fetch egui_extras 0.29.1
          ls -d */ > /tmp/diag.txt 2>&1
          python3 - <<'PY' > /tmp/api-dump.txt 2>&1
          import glob, re, sys, os

          def read(path):
              with open(path, encoding='utf-8', errors='replace') as f:
                  return f.read()

          def show_fn(src, name, max_lines=16):
              for m in re.finditer(r'pub (?:unsafe )?fn ' + re.escape(name) + r'\b', src):
                  start = m.start()
                  depth = 0
                  i = src.index('(', start)
                  j = i
                  while j < len(src):
                      c = src[j]
                      if c == '(':
                          depth += 1
                      elif c == ')':
                          depth -= 1
                          if depth == 0:
                              break
                      j += 1
                  snippet = src[start:j+1]
                  # include return type up to ';' or '{'
                  k = src.find(';', j)
                  k2 = src.find('{', j)
                  if k == -1: k = k2
                  if k2 != -1 and (k == -1 or k2 < k): k = k2
                  if k != -1:
                      snippet += src[j+1:k].rstrip()
                  snippet = re.sub(r'\s+', ' ', snippet)
                  print(f"  {snippet[:600]}")
                  return
              print(f"  !! NOT FOUND: {name}")

          def show_struct(src, name, max_lines=60):
              m = re.search(r'pub struct ' + re.escape(name) + r'\b[^;{]*\{', src)
              if not m:
                  m2 = re.search(r'pub (?:type|union) ' + re.escape(name) + r'\b[^;]*;', src)
                  if m2:
                      print("  " + re.sub(r'\s+', ' ', m2.group(0))[:400])
                  else:
                      print(f"  !! STRUCT NOT FOUND: {name}")
                  return
              start = m.start()
              j = m.end() - 1
              depth = 0
              while j < len(src):
                  if src[j] == '{': depth += 1
                  elif src[j] == '}':
                      depth -= 1
                      if depth == 0:
                          j += 1
                          break
                  j += 1
              body = src[start:j]
              body = re.sub(r'\n\s*///?[^\n]*', '', body)
              body = re.sub(r'#\[[^\]]*\]', '', body)
              body = re.sub(r'\n\s*\n', '\n', body)
              lines = body.split('\n')
              print('\n'.join('  ' + l.strip() for l in lines[:max_lines]))
              if len(lines) > max_lines:
                  print(f'  ... ({len(lines)} lines total)')

          def show_const(src, name):
              m = re.search(r'pub const ' + re.escape(name) + r'\s*:[^=]+=[^;]+;', src)
              if m:
                  print("  " + re.sub(r'\s+', ' ', m.group(0))[:300])
              else:
                  print(f"  !! CONST NOT FOUND: {name}")

          WS = 'windows-sys-0.59.0'
          files = {p.split('Windows/Win32/')[-1].replace('/mod.rs','').replace('.rs',''): p
                   for p in glob.glob(f'{WS}/src/Windows/Win32/**/*.rs', recursive=True)}
          def f(key):
              if key not in files:
                  print(f"!! FILE NOT FOUND for {key}")
                  return ''
              return read(files[key])

          cargo = read(f'{WS}/Cargo.toml')
          feats = re.findall(r'^(Win32_[A-Za-z0-9_]+) = \[', cargo, re.M)
          want = ['Services','Registry','ProcessStatus','SystemInformation','Threading','Environment',
                  'Diagnostics_Debug','Storage_FileSystem','Security','NetworkManagement_IpHelper','Globalization',
                  'Graphics_Gdi','UI_Shell','UI_WindowsAndMessaging','System_IO','LibraryLoader','System_Com',
                  'System_Console','Security_Authorization','System_Power','Storage_FileSystem']
          print('=== windows-sys relevant features ===')
          for w in want:
              hits = [x for x in feats if w in x]
              print(f'  {w}: {hits[:6]}')

          print('\n=== Services ===')
          src = f('System/Services')
          for n in ['OpenSCManagerW','OpenServiceW','CloseServiceHandle','EnumServicesStatusExW','QueryServiceConfigW',
                    'QueryServiceConfig2W','ChangeServiceConfigW','ChangeServiceConfig2W','ControlService','StartServiceW',
                    'QueryServiceStatusEx','EnumDependentServicesW','QueryServiceStatus']:
              show_fn(src, n)
          for s in ['ENUM_SERVICE_STATUS_PROCESSW','SERVICE_STATUS_PROCESS','SERVICE_STATUS','QUERY_SERVICE_CONFIGW',
                    'SERVICE_DESCRIPTIONW','SERVICE_DELAYED_AUTO_START_INFO','SERVICE_FAILURE_ACTIONSW','SERVICE_FAILURE_ACTIONS_FLAG']:
              show_struct(src, s)
          for c in ['SC_ENUM_PROCESS_INFO','SERVICE_WIN32','SERVICE_STATE_ALL','SC_MANAGER_ENUMERATE_SERVICE',
                    'SERVICE_QUERY_CONFIG','SERVICE_CHANGE_CONFIG','SERVICE_START','SERVICE_STOP','SERVICE_PAUSE_CONTINUE',
                    'SERVICE_QUERY_STATUS','SERVICE_STOPPED','SERVICE_RUNNING','SERVICE_PAUSED','SERVICE_START_PENDING',
                    'SERVICE_STOP_PENDING','SERVICE_CONTINUE_PENDING','SERVICE_PAUSE_PENDING','SERVICE_DISABLED',
                    'SERVICE_DEMAND_START','SERVICE_AUTO_START','SERVICE_BOOT_START','SERVICE_SYSTEM_START',
                    'SERVICE_CONFIG_DESCRIPTION','SERVICE_CONFIG_DELAYED_AUTO_START_INFO','SERVICE_CONFIG_FAILURE_ACTIONS',
                    'SERVICE_CONTROL_STOP','SERVICE_CONTROL_PAUSE','SERVICE_CONTROL_CONTINUE','SERVICE_ACCEPT_STOP',
                    'SERVICE_ERROR_NORMAL','SERVICE_QUERY_STATUS']:
              show_const(src, c)

          print('\n=== Threading ===')
          src = f('System/Threading')
          for n in ['OpenProcess','TerminateProcess','GetProcessTimes','QueryFullProcessImageNameW','CreateToolhelp32Snapshot',
                    'Process32FirstW','Process32NextW','OpenProcessToken','SetPriorityClass','GetPriorityClass',
                    'SetProcessAffinityMask','GetProcessAffinityMask','SuspendThread','ResumeThread','OpenThread','WaitForSingleObject']:
              show_fn(src, n)
          for s in ['PROCESSENTRY32W','PROCESS_ACCESS_RIGHTS','STARTUPINFOW','PROCESS_INFORMATION','STARTUPINFOEXW']:
              show_struct(src, s)
          for c in ['PROCESS_QUERY_LIMITED_INFORMATION','PROCESS_TERMINATE','PROCESS_SET_INFORMATION','PROCESS_QUERY_INFORMATION',
                    'PROCESS_VM_READ','THREAD_SUSPEND_RESUME','TH32CS_SNAPPROCESS','SYNCHRONIZE','TOKEN_QUERY','TOKEN_ADJUST_PRIVILEGES',
                    'INFINITE','STILL_ACTIVE']:
              show_const(src, c)

          print('\n=== ProcessStatus ===')
          src = f('System/ProcessStatus')
          for n in ['EnumProcesses','GetProcessMemoryInfo','K32EnumProcesses','K32GetProcessMemoryInfo']:
              show_fn(src, n)
          for s in ['PROCESS_MEMORY_COUNTERS','PROCESS_MEMORY_COUNTERS_EX']:
              show_struct(src, s)

          print('\n=== SystemInformation ===')
          src = f('System/SystemInformation')
          for n in ['GlobalMemoryStatusEx','GetSystemTimes','GetTickCount64','GetComputerNameExW','GetSystemInfo','GetPhysicallyInstalledSystemMemory']:
              show_fn(src, n)
          for s in ['MEMORYSTATUSEX','SYSTEM_INFO','OSVERSIONINFOEXW']:
              show_struct(src, s)
          for c in ['ComputerNameDnsHostname','ComputerNamePhysicalDnsDomain']:
              show_const(src, c)

          print('\n=== Registry ===')
          src = f('System/Registry')
          for n in ['RegOpenKeyExW','RegEnumKeyExW','RegEnumValueW','RegQueryValueExW','RegSetValueExW','RegCreateKeyExW',
                    'RegDeleteKeyW','RegDeleteKeyExW','RegDeleteValueW','RegCloseKey','RegQueryInfoKeyW','RegGetValueW']:
              show_fn(src, n)
          for c in ['HKEY_CURRENT_USER','HKEY_LOCAL_MACHINE','KEY_READ','KEY_WRITE','KEY_ALL_ACCESS','KEY_WOW64_64KEY',
                    'KEY_WOW64_32KEY','KEY_ENUMERATE_SUB_KEYS','KEY_SET_VALUE','KEY_CREATE_SUB_KEY','KEY_QUERY_VALUE',
                    'REG_SZ','REG_EXPAND_SZ','REG_DWORD','REG_QWORD','REG_BINARY','REG_MULTI_SZ','REG_NONE','REG_OPTION_NON_VOLATILE']:
              show_const(src, c)

          print('\n=== UI/Shell ===')
          src = f('UI/Shell')
          for n in ['SHGetFileInfoW','SHGetKnownFolderPath','SHFileOperationW','ShellExecuteExW','ShellExecuteW','DragQueryFileW',
                    'DragQueryPoint','SHChangeNotify']:
              show_fn(src, n)
          for s in ['SHFILEINFOW','SHFILEOPSTRUCTW','SHELLEXECUTEINFOW','KNOWNFOLDERID']:
              show_struct(src, s)
          for c in ['SHGFI_ICON','SHGFI_SMALLICON','SHGFI_LARGEICON','SHGFI_USEFILEATTRIBUTES','SHGFI_DISPLAYNAME','SHGFI_TYPENAME',
                    'SHGFI_SYSICONINDEX','FO_DELETE','FO_COPY','FO_MOVE','FO_RENAME','FOF_ALLOWUNDO','FOF_SILENT','FOF_NOCONFIRMATION',
                    'FOF_NOCONFIRMMKDIR','FOF_NOERRORUI','FOF_WANTNUKEWARNING','SEE_MASK_INVOKEIDLIST','SEE_MASK_NOCLOSEPROCESS',
                    'KF_FLAG_DEFAULT','SEE_MASK_FLAG_NO_UI']:
              show_const(src, c)

          print('\n=== WindowsAndMessaging ===')
          src = f('UI/WindowsAndMessaging')
          for n in ['DestroyIcon','GetIconInfo','SendMessageTimeoutW','PostMessageW','GetWindowTextW','SetForegroundWindow']:
              show_fn(src, n)
          for s in ['ICONINFO']:
              show_struct(src, s)
          for c in ['HWND_BROADCAST','WM_SETTINGCHANGE','SMTO_ABORTIFHUNG']:
              show_const(src, c)

          print('\n=== GDI ===')
          src = f('Graphics/Gdi')
          for n in ['GetDC','ReleaseDC','CreateCompatibleDC','DeleteDC','GetDIBits','DeleteObject','GetObjectW','CreateDIBSection']:
              show_fn(src, n)
          for s in ['BITMAP','BITMAPINFO','BITMAPINFOHEADER']:
              show_struct(src, s)
          for c in ['BI_RGB','DIB_RGB_COLORS']:
              show_const(src, c)

          print('\n=== Storage/FileSystem ===')
          src = f('Storage/FileSystem')
          for n in ['GetLogicalDrives','GetDriveTypeW','GetVolumeInformationW','GetDiskFreeSpaceExW','FindFirstFileW','FindNextFileW',
                    'FindClose','MoveFileExW','CreateDirectoryW','RemoveDirectoryW','GetFileAttributesW','SetFileAttributesW',
                    'CopyFileExW','FileTimeToLocalFileTime','FileTimeToSystemTime','GetFileSizeEx','GetTempPathW','GetFullPathNameW']:
              show_fn(src, n)
          for s in ['WIN32_FIND_DATAW','SYSTEMTIME']:
              show_struct(src, s)
          for c in ['DRIVE_FIXED','DRIVE_REMOVABLE','DRIVE_REMOTE','DRIVE_CDROM','DRIVE_RAMDISK','DRIVE_UNKNOWN','DRIVE_NO_ROOT_DIR',
                    'FILE_ATTRIBUTE_HIDDEN','FILE_ATTRIBUTE_SYSTEM','FILE_ATTRIBUTE_DIRECTORY','FILE_ATTRIBUTE_READONLY',
                    'MOVEFILE_REPLACE_EXISTING','MOVEFILE_COPY_ALLOWED','FILE_ATTRIBUTE_NORMAL']:
              show_const(src, c)

          print('\n=== Environment ===')
          src = f('System/Environment')
          for n in ['GetEnvironmentVariableW','SetEnvironmentVariableW','ExpandEnvironmentStringsW','GetEnvironmentStringsW',
                    'FreeEnvironmentStringsW']:
              show_fn(src, n)

          print('\n=== IpHelper ===')
          src = f('NetworkManagement/IpHelper')
          for n in ['GetExtendedTcpTable','GetExtendedUdpTable']:
              show_fn(src, n)
          for s in ['MIB_TCPTABLE_OWNER_PID','MIB_TCPROW_OWNER_PID','MIB_UDPTABLE_OWNER_PID']:
              show_struct(src, s)
          for c in ['TCP_TABLE_OWNER_PID_ALL','AF_INET','ERROR_INSUFFICIENT_BUFFER']:
              show_const(src, c)

          print('\n=== Globalization / Debug / Security ===')
          show_fn(f('Globalization'), 'GetUserDefaultUILanguage')
          src = f('System/Diagnostics/Debug')
          show_fn(src, 'FormatMessageW')
          for c in ['FORMAT_MESSAGE_FROM_SYSTEM','FORMAT_MESSAGE_IGNORE_INSERTS','FORMAT_MESSAGE_ALLOCATE_BUFFER']:
              show_const(src, c)
          src = f('Security')
          for n in ['GetTokenInformation','LookupAccountSidW','GetSidSubAuthorityCount','GetSidSubAuthority','GetLengthSid','ConvertSidToStringSidW']:
              show_fn(src, n)
          for s in ['TOKEN_USER','TOKEN_ELEVATION','TOKEN_MANDATORY_LABEL','SID_AND_ATTRIBUTES']:
              show_struct(src, s)
          for c in ['TokenUser','TokenElevation','TokenIntegrityLevel','TokenElevationType','TRUE']:
              show_const(src, c)

          print('\n=== Foundation ===')
          src = f('Foundation')
          for c in ['INVALID_HANDLE_VALUE','ERROR_SUCCESS','ERROR_MORE_DATA','ERROR_NO_MORE_ITEMS','ERROR_INSUFFICIENT_BUFFER',
                    'ERROR_FILE_NOT_FOUND','ERROR_ACCESS_DENIED','ERROR_ALREADY_EXISTS','WAIT_OBJECT_0','HANDLE','HWND','BOOL','FILETIME','LARGE_INTEGER']:
              if c in ('HANDLE','HWND','BOOL','FILETIME','LARGE_INTEGER'):
                  show_struct(src, c)
              else:
                  show_const(src, c)
          for n in ['CloseHandle','GetLastError','GetTickCount64']:
              show_fn(src, n)

          print('\n=== eframe 0.29.1 ===')
          src = read('eframe-0.29.1/src/lib.rs')
          show_fn(src, 'run_native', 30)
          show_struct(src, 'NativeOptions', 80)
          src = read('egui-0.29.1/src/viewport.rs')
          for n in ['with_inner_size','with_min_inner_size','with_title','with_icon','with_resizable']:
              show_fn(src, n)
          src = read('egui-0.29.1/src/data/icon_data.rs') if os.path.exists('egui-0.29.1/src/data/icon_data.rs') else read('egui-0.29.1/src/icon_data.rs')
          for n in ['from_rgba_unmultiplied']:
              show_fn(src, n)
          src = read('egui_extras-0.29.1/src/table.rs')
          for n in ['new','column','striped','resizable','header','body','rows','cell','col']:
              show_fn(src, n, 10)
          src = read('egui-0.29.1/src/context.rs')
          for n in ['set_fonts','set_visuals','set_theme','style_mut']:
              show_fn(src, n, 8)
          src = read('egui-0.29.1/src/fonts.rs')
          show_struct(src, 'FontDefinitions', 40)
          show_struct(src, 'FontData', 30)
          PY
          echo "=== dump size: $(wc -l < /tmp/api-dump.txt) lines ==="
          head -c 300 /tmp/api-dump.txt
          exit 0
      - name: upload dump
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: |
            /tmp/api-dump.txt
            /tmp/diag.txt
      - name: print dump
        run: cat /tmp/api-dump.txt
