name: kernel

# The KMDF driver needs the WDK + LLVM, which most development environments do
# not have, so it gets its own workflow instead of riding along with `build`.
#
# The driver is a separate cargo invocation (`-p winrust-kernel`) and is *not*
# part of `cargo build --workspace` in build.yml, because that job has no WDK.

on:
  push:
    branches: [arena/1e8c9b58-winrust]
    paths:
      - "crates/winrust-kernel/**"
      - "crates/winrust-kernel-abi/**"
      - ".github/workflows/kernel.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Kernel code cannot unwind and has no C runtime to link against:
  # wdk-build refuses to build without the static CRT
  # (`StaticCrtNotEnabled`), and Microsoft's own driver CI sets exactly this.
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  kmdf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: rustfmt + clippy
        run: rustup component add clippy rustfmt

      - name: LLVM (bindgen's libclang)
        shell: pwsh
        run: |
          # wdk-sys generates its bindings with bindgen, which needs libclang.
          # The runner image already ships LLVM; only verify it is on PATH.
          $clang = Get-ChildItem "C:\Program Files\LLVM\bin\libclang.dll" -ErrorAction SilentlyContinue
          if (-not $clang) {
            Write-Host "installing LLVM via winget"
            winget install --id LLVM.LLVM --version 18.1.8 --silent --accept-package-agreements --accept-source-agreements
          }
          if (Test-Path "C:\Program Files\LLVM\bin") {
            "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
          Write-Host "LIBCLANG_PATH=$env:LIBCLANG_PATH"

      # The runner image's installed WDK is missing the `km/crt` headers that
      # KMDF needs, so the driver build uses the official NuGet WDK packages
      # (the same route microsoft/windows-drivers-rs uses in its own CI) and
      # points WDKContentRoot/WDKBinRoot at them.
      - name: WDK from NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkVersion = "10.0.26100"
          $root = "C:\packages"
          New-Item -ItemType Directory -Force $root | Out-Null

          # Resolve the newest QFE that exists on NuGet: the flat-container index
          # lists every published version.
          $index = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/index.json"
          $candidates = @($index.versions | Where-Object { $_ -like "$sdkVersion.*" })
          if ($candidates.Count -eq 0) { throw "no WDK $sdkVersion package on NuGet" }
          $version = ($candidates | Sort-Object { [version]$_ } | Select-Object -Last 1)
          Write-Host "WDK version: $version"

          nuget install Microsoft.Windows.WDK.x64 -Version $version -OutputDirectory $root
          if ($LASTEXITCODE -ne 0) { throw "WDK x64 install failed" }
          nuget install Microsoft.Windows.SDK.CPP -Version $version -OutputDirectory $root
          if ($LASTEXITCODE -ne 0) { throw "SDK install failed" }

          $dirs = Get-ChildItem $root -Directory
          $wdk = ($dirs | Where-Object { $_.Name -like "Microsoft.Windows.WDK.x64.*" } | Select-Object -First 1).FullName
          $sdk = ($dirs | Where-Object { $_.Name -like "Microsoft.Windows.SDK.CPP.$version*" } | Select-Object -First 1).FullName
          if (-not $sdk) {
            $sdk = ($dirs | Where-Object { $_.Name -like "Microsoft.Windows.SDK.CPP.*" } | Select-Object -First 1).FullName
          }
          Write-Host "WDK: $wdk"
          Write-Host "SDK: $sdk"

          "WDKContentRoot=$wdk\c"                    | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "WDKBinRoot=$wdk\c\bin\$sdkVersion.0"   | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "WDKToolRoot=$wdk\c\tools\$sdkVersion.0" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "WindowsSdkBinPath=$sdk\c\bin"           | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "Version_Number=$sdkVersion.0"             | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          Write-Host "--- km/crt check ---"
          Get-ChildItem "$wdk\c\Include\$sdkVersion.0\km\crt" -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { $_.Name }

      # Same contract as build.yml: each check records its real exit code in a
      # `.code` file and the job is judged at the end, so a failure is visible
      # in the run status instead of only inside a committed log.
      #
      # `shell: bash` matters: under pwsh `$?` is `True`/`False`, and
      # `code=0 ... || code=$?` survives the `-e` the runner enables (a bare
      # `cmd; code=$?` would abort the step before the assignment).
      - name: cargo fmt --check (kernel crates)
        continue-on-error: true
        shell: bash
        run: |
          # `winrust-kernel` is a separate workspace, so it is formatted on its
          # own; the ABI crate and the client belong to the root workspace.
          code=0
          cargo fmt -p winrust-kernel-abi -p winrust-kernel-control --check > fmt.txt 2>&1 || code=$?
          ( cd crates/winrust-kernel && cargo fmt --check >> ../../fmt.txt 2>&1 || echo "kernel workspace: $?" >> ../../fmt.txt )
          echo "$code" > fmt.code
          exit "$code"

      - name: build the user-mode client
        continue-on-error: true
        shell: bash
        run: |
          code=0
          cargo build -p winrust-kernel-control --release > control.txt 2>&1 || code=$?
          echo "$code" > control.code
          exit "$code"

      # `wdk-build` locates the WDK content root through the WDK's own
      # environment, which the VS Developer Prompt sets up.  Using the
      # powershell entry point gives us the same variables cargo needs.
      - name: build the driver (KMDF)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # `--target` is required: RUSTFLAGS-based `crt-static` is ignored for
          # the host triple unless a target is named explicitly.  The driver is
          # its own workspace, so the build runs from its directory and writes
          # its artifacts under crates/winrust-kernel/target.
          Push-Location crates/winrust-kernel
          cargo build --release --target x86_64-pc-windows-msvc *>&1 | Tee-Object -FilePath ../../driver.txt
          $code = $LASTEXITCODE
          Pop-Location
          # $LASTEXITCODE is the real code; the report keeps the log alone and
          # the code goes in its own file, which collect-diagnostics turns into
          # the `exit=` line the summary step reads.
          "$code" | Out-File -Encoding utf8 driver.code
          exit $code

      - name: collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p docs/ci/build
          for f in fmt control driver; do
            code=missing
            # Keep digits only: PowerShell may hand the code over with a BOM
            # or a CR, and a byte comparison against "0" must not trip on that.
            if [ -f "$f.code" ]; then code=$(tr -cd '0-9' < "$f.code"); fi
            if [ -z "$code" ]; then code=missing; fi
            {
              echo "exit=$code"
              if [ -f "$f.txt" ]; then head -c 200000 "$f.txt"; fi
            } > "docs/ci/build/kernel-$f.txt"
          done
          ls -la crates/winrust-kernel/target/x86_64-pc-windows-msvc/release/*.dll \
            target/release/winrust-driver.exe 2>/dev/null \
            > docs/ci/build/kernel-artifacts.txt || true

      - name: commit diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "WinRust CI"
          git config user.email "ci@winrust.local"
          git add docs/ci/build
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "ci: kernel diagnostics [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch -q origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1

      - name: upload driver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winrust-kernel
          path: |
            crates/winrust-kernel/target/x86_64-pc-windows-msvc/release/winrust_kernel.dll
            crates/winrust-kernel/target/x86_64-pc-windows-msvc/release/winrust-kernel.dll
            target/release/winrust-driver.exe
            crates/winrust-kernel/WinRustKernel.inx
          if-no-files-found: ignore

      # Judge the run from the reports, last, so a failure still commits its
      # diagnostics first.
      - name: fail the run if a check failed
        if: always()
        shell: bash
        run: |
          failed=""
          for f in fmt control driver; do
            report="docs/ci/build/kernel-$f.txt"
            if [ ! -f "$report" ]; then
              failed="$failed $f(no report)"
              continue
            fi
            code=$(head -1 "$report" | sed 's/^exit=//')
            if [ "$code" != "0" ]; then
              failed="$failed $f($code)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::failed checks:$failed"
            exit 1
          fi
          echo "all kernel checks passed"
