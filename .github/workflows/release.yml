name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo build (release)
        run: cargo build --workspace --release

      # The kernel driver needs the WDK's NuGet packages; see kernel.yml.
      - name: install WDK from NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkVersion = "10.0.26100"
          $root = "C:\packages"
          New-Item -ItemType Directory -Force $root | Out-Null
          $index = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/index.json"
          $candidates = @($index.versions | Where-Object { $_ -like "$sdkVersion.*" })
          $version = ($candidates | Sort-Object { [version]$_ } | Select-Object -Last 1)
          nuget install Microsoft.Windows.WDK.x64 -Version $version -OutputDirectory $root
          nuget install Microsoft.Windows.SDK.CPP -Version $version -OutputDirectory $root
          $dirs = Get-ChildItem $root -Directory
          $wdk = ($dirs | Where-Object { $_.Name -like "Microsoft.Windows.WDK.x64.*" } | Select-Object -First 1).FullName
          $sdk = ($dirs | Where-Object { $_.Name -like "Microsoft.Windows.SDK.CPP.$version*" } | Select-Object -First 1).FullName
          "WDKContentRoot=$wdk\c" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "WDKBinRoot=$wdk\c\bin\$sdkVersion.0" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "WindowsSdkBinPath=$sdk\c\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "Version_Number=$sdkVersion.0" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: cargo build (kernel driver)
        shell: pwsh
        working-directory: crates/winrust-kernel
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: stage binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/WinRust.exe dist/ || true
          cp target/release/winrust-explorer.exe dist/ || true
          cp target/release/winrust-taskmgr.exe dist/ || true
          cp target/release/winrust-services.exe dist/ || true
          cp target/release/winrust-sysctl.exe dist/ || true
          cp target/release/winrust-driver.exe dist/ || true
          cp crates/winrust-kernel/target/x86_64-pc-windows-msvc/release/winrust_kernel.dll dist/WinRustKernel.sys || true
          cp crates/winrust-kernel/WinRustKernel.inx dist/WinRustKernel.inf || true
          cp README.md dist/ || true
          ls -la dist

      - name: zip binaries
        shell: bash
        run: |
          cd dist && 7z a -tzip ../WinRust-windows-x64.zip * > /dev/null

      - name: publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            --title "WinRust $TAG" \
            --notes "Windows 10/11 system components rewritten in Rust: Explorer, Task Manager, Services, system utilities and the core library.

          **Launcher \`WinRust.exe\` is now a selective installer**

          * one checkbox per component — install only what you want
          * per component: Portable / IFEO redirect / replace system binary / custom shell
          * System Restore point (\`SRSetRestorePointW\`) and file-level backup in
            \`%ProgramData%\WinRust\backup\`, both on by default
          * backup browser with one-click rollback; installed state persisted in
            \`HKLM\SOFTWARE\WinRust\Installed\`
          * everything logged in the window

          **Downloads**
          **Kernel driver (new)**
          * \`WinRustKernel.sys\` — KMDF driver built with the WDK from Rust sources.
            Kernel-side process and module tables (works for PPL processes too) and
            an in-RAM process-creation block list.
          * \`winrust-driver.exe\` — console: \`install\`, \`status\`, \`processes\`,
            \`modules\`, \`perf\`, \`block <name>\`, \`remove\`.
          * Install: \`winrust-driver install WinRustKernel.sys\` from an elevated prompt,
            then \`winrust-driver processes\`.  \`winrust-driver remove\` unloads and
            unregisters it.  The driver is test-signed by CI; see the README before
            deploying it to a machine you care about.

          * \`WinRust-windows-x64.zip\` — all executables, the driver and README.
          * Or grab a single .exe below.

          Run the component you need; elevation (Run as administrator) is required for service control, for managing other users' processes, and for any install action." \
            dist/WinRust.exe \
            dist/winrust-explorer.exe \
            dist/winrust-taskmgr.exe \
            dist/winrust-services.exe \
            dist/winrust-sysctl.exe \
            dist/winrust-driver.exe \
            dist/WinRustKernel.sys \
            WinRust-windows-x64.zip
