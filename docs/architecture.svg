<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1180" viewBox="0 0 1180 1180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8798"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1180" height="1180" fill="#12171f"/>

  <text x="40" y="46" fill="#e8edf4" font-size="24" font-weight="600">WinRust: структура до и после deslop-please</text>
  <text x="40" y="72" fill="#8b98a8" font-size="14">Стрелка = «использует». Слева — v0.8.0, справа — эта ветка. Все цифры проверены линтером на итоговом коммите.</text>

  <!-- ===================== BEFORE ===================== -->
  <text x="40" y="118" fill="#c0392b" font-size="17" font-weight="600">БЫЛО</text>
  <rect x="40" y="130" width="520" height="1020" rx="10" fill="#171d26" stroke="#2a3441"/>

  <text x="60" y="162" fill="#c8d2de" font-size="14" font-weight="600">Ядро: цикл из трёх модулей</text>
  <g stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowRed)">
    <path d="M 175 200 L 300 200"/>
    <path d="M 330 232 L 330 330"/>
    <path d="M 388 200 L 512 200"/>
    <path d="M 512 232 C 512 300, 240 300, 240 232"/>
  </g>
  <rect x="120" y="185" width="110" height="40" rx="6" fill="#2a1a1a" stroke="#c0392b"/>
  <text x="175" y="210" fill="#f2b8b0" font-size="14" text-anchor="middle">system</text>
  <rect x="270" y="185" width="110" height="40" rx="6" fill="#2a1a1a" stroke="#c0392b"/>
  <text x="325" y="210" fill="#f2b8b0" font-size="14" text-anchor="middle">shell</text>
  <rect x="420" y="185" width="110" height="40" rx="6" fill="#2a1a1a" stroke="#c0392b"/>
  <text x="475" y="210" fill="#f2b8b0" font-size="14" text-anchor="middle">process</text>
  <text x="120" y="262" fill="#e0736a" font-size="12">system → shell (питание через launch)</text>
  <text x="120" y="280" fill="#e0736a" font-size="12">shell → process (exe окон для taskbar)</text>
  <text x="120" y="298" fill="#e0736a" font-size="12">process → system (число ядер для affinity)</text>
  <text x="120" y="322" fill="#8b98a8" font-size="12" font-style="italic">порядка чтения нет: любой из трёх «первый»</text>

  <text x="60" y="382" fill="#c8d2de" font-size="14" font-weight="600">Модуль делал две работы</text>
  <rect x="60" y="396" width="470" height="86" rx="5" fill="#2a1a1a" stroke="#c0392b"/>
  <text x="72" y="418" fill="#f2b8b0" font-size="13">shell.rs — 903 строки</text>
  <text x="72" y="440" fill="#e0736a" font-size="12">ShellExecute, значки, корзина</text>
  <text x="72" y="458" fill="#e0736a" font-size="12">и тут же: список окон, фокус, клавиша Win</text>

  <text x="60" y="520" fill="#c8d2de" font-size="14" font-weight="600">Плоская свалка из 22 модулей</text>
  <rect x="60" y="534" width="470" height="118" rx="5" fill="#2a1a1a" stroke="#c0392b"/>
  <text x="72" y="556" fill="#f2b8b0" font-size="12" font-family="monospace">audio disk error fileassoc files gpu</text>
  <text x="72" y="576" fill="#f2b8b0" font-size="12" font-family="monospace">handle icon install net process</text>
  <text x="72" y="596" fill="#f2b8b0" font-size="12" font-family="monospace">registry restore service shell system</text>
  <text x="72" y="616" fill="#f2b8b0" font-size="12" font-family="monospace">thumb user wide window</text>
  <text x="72" y="640" fill="#8b98a8" font-size="12" font-style="italic">по имени не видно, какой слой и кто кого может звать</text>

  <text x="60" y="690" fill="#c8d2de" font-size="14" font-weight="600">Файлы больше 2000 строк</text>
  <rect x="60" y="704" width="470" height="34" rx="5" fill="#2a1a1a" stroke="#c0392b"/>
  <text x="72" y="726" fill="#f2b8b0" font-size="13">explorer/app.rs — 3560 строк</text>
  <rect x="60" y="744" width="330" height="34" rx="5" fill="#2a1a1a" stroke="#c0392b"/>
  <text x="72" y="766" fill="#f2b8b0" font-size="13">taskmgr/app.rs — 2184 строки</text>
  <text x="60" y="800" fill="#8b98a8" font-size="12">в одном файле: восемь видов, модель,</text>
  <text x="60" y="818" fill="#8b98a8" font-size="12">сэмплер, команды, клавиатура</text>

  <text x="60" y="866" fill="#c8d2de" font-size="14" font-weight="600">Утечка полей</text>
  <rect x="60" y="880" width="470" height="96" rx="5" fill="#2a1a1a" stroke="#c0392b"/>
  <text x="72" y="902" fill="#f2b8b0" font-size="13">DesktopApp — 55 полей, 8 писал tray.rs</text>
  <text x="72" y="924" fill="#e0736a" font-size="12">volume, muted, lang_tag, notifications,</text>
  <text x="72" y="942" fill="#e0736a" font-size="12">notifications_read, start_open, tray_flyout, tray_overflow</text>
  <text x="72" y="962" fill="#8b98a8" font-size="12" font-style="italic">у типа не осталось ни одного своего поля</text>

  <text x="60" y="1016" fill="#c8d2de" font-size="14" font-weight="600">Итог линтера</text>
  <text x="60" y="1042" fill="#e8edf4" font-size="13">field-leak: 8 полей у 1 типа</text>
  <text x="60" y="1064" fill="#e8edf4" font-size="13">tangle: 1 круг (system · shell · process)</text>
  <text x="60" y="1086" fill="#e8edf4" font-size="13">long-file: 2 · wide-directory: 1 (22 элемента)</text>

  <!-- ===================== AFTER ===================== -->
  <text x="620" y="118" fill="#3fbf7f" font-size="17" font-weight="600">СТАЛО</text>
  <rect x="620" y="130" width="520" height="1020" rx="10" fill="#171d26" stroke="#2a3441"/>

  <text x="640" y="162" fill="#c8d2de" font-size="14" font-weight="600">Ядро: семь групп, циклов нет</text>
  <rect x="640" y="176" width="480" height="176" rx="6" fill="#16241c" stroke="#2f7d55"/>
  <text x="654" y="198" fill="#bfe9d3" font-size="13" font-family="monospace">devices/   audio · net · install</text>
  <text x="654" y="220" fill="#bfe9d3" font-size="13" font-family="monospace">shell/     shell · window</text>
  <text x="654" y="242" fill="#bfe9d3" font-size="13" font-family="monospace">i18n/      langs · settings · shorten</text>
  <text x="654" y="264" fill="#bfe9d3" font-size="13" font-family="monospace">storage/   disk · files · fileassoc</text>
  <text x="770" y="264" fill="#8fb8a0" font-size="12" font-family="monospace">registry · restore · thumb</text>
  <text x="654" y="286" fill="#bfe9d3" font-size="13" font-family="monospace">system/    system · process · service</text>
  <text x="770" y="286" fill="#8fb8a0" font-size="12" font-family="monospace">user · gpu</text>
  <text x="654" y="308" fill="#bfe9d3" font-size="13" font-family="monospace">leaf       error · handle · icon · wide</text>
  <text x="654" y="334" fill="#3fbf7f" font-size="12">старый путь работает: winrust_core::process — это ре-экспорт</text>

  <text x="640" y="386" fill="#c8d2de" font-size="14" font-weight="600">Три разреза по швам</text>
  <rect x="640" y="400" width="480" height="112" rx="5" fill="#16241c" stroke="#2f7d55"/>
  <text x="652" y="422" fill="#bfe9d3" font-size="13">window.rs ← из shell.rs (332 строки)</text>
  <text x="664" y="442" fill="#8fb8a0" font-size="12">окна, значки окон, фокус, клавиша Win</text>
  <text x="652" y="466" fill="#bfe9d3" font-size="13">питание: system → shell</text>
  <text x="664" y="486" fill="#8fb8a0" font-size="12">lock / sign out / restart / shutdown — там, где launch</text>
  <text x="652" y="506" fill="#bfe9d3" font-size="13">process::set_affinity считает ядра сам</text>

  <text x="640" y="552" fill="#c8d2de" font-size="14" font-weight="600">Файлы — по одной ответственности</text>
  <rect x="640" y="566" width="480" height="150" rx="5" fill="#16241c" stroke="#2f7d55"/>
  <text x="652" y="588" fill="#bfe9d3" font-size="13">explorer/app.rs 3560 → 42 + девять модулей</text>
  <text x="664" y="608" fill="#8fb8a0" font-size="12">viewmode 139 · tabs 116 · state 496 · commands 421</text>
  <text x="664" y="626" fill="#8fb8a0" font-size="12">panels 478 · sidebar 243 · views 844 · preview 208 · keyboard 679</text>
  <text x="652" y="652" fill="#bfe9d3" font-size="13">taskmgr/app.rs 2184 → 273 + шесть модулей</text>
  <text x="664" y="672" fill="#8fb8a0" font-size="12">model 478 · ui 1213 · startup 115 · format 71 · sort 31 · tabs 52</text>
  <text x="652" y="696" fill="#8fb8a0" font-size="12">зависимости в одну сторону: format ← model ← ui</text>

  <text x="640" y="750" fill="#c8d2de" font-size="14" font-weight="600">Трей владеет своим состоянием</text>
  <rect x="640" y="764" width="480" height="112" rx="5" fill="#16241c" stroke="#2f7d55"/>
  <text x="652" y="786" fill="#bfe9d3" font-size="13">TrayState: 10 приватных полей, геттеры и глаголы</text>
  <text x="664" y="806" fill="#8fb8a0" font-size="12">toggle / open / close · set_volume / set_muted</text>
  <text x="664" y="824" fill="#8fb8a0" font-size="12">set_language · clear / mark_read · sample()</text>
  <text x="652" y="850" fill="#bfe9d3" font-size="13">Start: show_start / toggle_start / close_start</text>
  <text x="664" y="868" fill="#8fb8a0" font-size="12">tray.rs и taskbar.rs больше не пишут поля напрямую</text>

  <text x="640" y="916" fill="#c8d2de" font-size="14" font-weight="600">Итог линтера</text>
  <rect x="640" y="930" width="480" height="176" rx="6" fill="#16241c" stroke="#3fbf7f"/>
  <text x="652" y="956" fill="#bfe9d3" font-size="14">field-leak            8 → 0</text>
  <text x="652" y="982" fill="#bfe9d3" font-size="14">tangle                1 → 0</text>
  <text x="652" y="1008" fill="#bfe9d3" font-size="14">long-file             2 → 0</text>
  <text x="652" y="1034" fill="#bfe9d3" font-size="14"> широкий каталог      22 → 10</text>
  <text x="652" y="1060" fill="#8fb8a0" font-size="12">module-cycle: 0 (был 0 — цикл ловил tangle)</text>
  <text x="652" y="1082" fill="#8fb8a0" font-size="12">CI: release · clippy · test — все exit=True</text>
</svg>
