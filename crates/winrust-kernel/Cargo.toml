# Standalone workspace: see the note in the repository root Cargo.toml.
[workspace]

[package]
name = "winrust-kernel"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MadBullet/WinRust"
publish = false
description = "WinRust kernel-mode driver (KMDF): system telemetry, driver inventory, process trust enforcement"

# A KMDF driver is a DLL that the WDF loader turns into a .sys image.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[dependencies]
winrust-kernel-abi = { path = "../winrust-kernel-abi" }
wdk = "0.5"
wdk-sys = "0.5"
wdk-alloc = "0.4"
wdk-panic = "0.5"

[build-dependencies]
wdk-build = "0.6"

# Kernel mode forbids unwinding: a panic has nowhere to return to, and the
# kernel has no C runtime to unwind with.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = "thin"
