[workspace]
resolver = "2"
members = [
    "crates/winrust-core",
    "crates/winrust-explorer",
    "crates/winrust-taskmgr",
    "crates/winrust-services",
    "crates/winrust-sysctl",
    "crates/winrust-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MadBullet/WinRust"

[workspace.dependencies]
winrust-core = { path = "crates/winrust-core" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_Security_Authorization",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"

# Release profile for the whole workspace: small, fast, shipping-ready binaries.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
